name: Validate inventory app
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check worker/api.mjs
          node --check public/app.js
      - name: Exercise API and SQLite schema
        run: node --experimental-sqlite --test tests/api.test.mjs
      - name: Bundle check (does not publish)
        run: npx --yes wrangler@4.168.0 deploy --dry-run --outdir .wrangler-check
